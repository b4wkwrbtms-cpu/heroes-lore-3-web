name: Interp CI (temporary)

on:
  push:
    branches: [interp-ci]

permissions:
  contents: write

concurrency:
  group: interp-ci
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:prod

      - name: Disable Jekyll
        run: touch wie-web/dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wie-web/dist
          publish_branch: interp-dist
          force_orphan: true

      - name: Format check
        run: cargo fmt --check
      - name: Tests (wie-backend)
        run: cargo test -p wie-backend
      - name: Clippy (changed crates)
        run: cargo clippy -p wie-backend -p wie-lgt --all-targets
      - name: Clippy (wie-web)
        run: cargo clippy -p wie-web --target wasm32-unknown-unknown
      - name: JS tests
        run: node --test wie-web/tests/*.test.cjs
